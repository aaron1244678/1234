 {name:'커뮤니티',items:[['notices','공지사항'],['jobs','채용정보'],['inquiry','Q&A'],['faq','FAQ']]},
 {name:'성과관리',items:[['activities','활동내역'],['news','뉴스·보도자료'],['magazine','부트매거진']]}
];
const main=document.querySelector('main');
const link=(id,label,cls='button')=>`<a class="${cls}" href="#/${id}">${label}</a>`;
const empty=(title,body='새로운 소식이 등록되면 이곳에서 확인하실 수 있습니다.')=>`<div class="empty"><strong>${esc(title)}</strong><p>${esc(body)}</p></div>`;
const external=(url,label)=>safeUrl(url)?`<a class="button primary" href="${esc(url)}" target="_blank" rel="noopener">${esc(label)} ↗</a>`:'';
const cards=()=>`<div class="courses">${C.courses.map(c=>`<a class="course" href="#/${c.id}"><div class="course-top"><span class="badge">${esc(c.level)}</span><small>${esc(c.en)}</small></div><h3>${esc(c.title)}</h3><p>${esc(c.description)}</p><div class="tags">${c.topics.map(t=>`<span>${esc(t)}</span>`).join('')}</div><div class="course-bottom"><span>${esc(c.name)}</span><b aria-hidden="true">↗</b></div></a>`).join('')}</div>`;
const title=(en,ko,more='')=>`<div class="section-title"><div><span class="eyebrow">${en}</span><h2>${ko}</h2></div>${more}</div>`;
function rows(items,type){return items.map(n=>`<a class="list-row" href="#/${type}/${encodeURIComponent(n.id)}"><span>${esc(n.category)}</span><strong>${esc(n.title)}</strong><time>${esc(n.date)}</time></a>`).join('')}
function home(){return `<section class="hero"><div class="wrap"><div class="hero-grid"><div><span class="eyebrow">JEJU YOUTH LEAP BOOTCAMP</span><h1>AI로 배우고,<br>제주에서 <em>도약하다.</em></h1><p>배움에서 실무로, 가능성에서 기회로.<br>제주대학교와 함께 나만의 다음을 만드세요.</p><div class="actions">${link('courses','교육과정 살펴보기 <span aria-hidden="true">↗</span>','button primary')}${link('apply','신청 안내')}</div></div><div class="pathway"><div class="pathway-head"><span>YOUR LEARNING PATH</span><b>나에게 맞는 시작</b></div>${C.courses.map((c,i)=>`<a href="#/${c.id}"><span class="num">0${i+1}</span><div><small>${esc(c.level)} · ${esc(c.en)}</small><strong>${['기초를 단단하게','실무를 경험하다','전문성을 더하다'][i]}</strong></div><span class="arrow" aria-hidden="true">↗</span></a>`).join('')}</div></div><div class="hero-bottom">JEJU NATIONAL UNIVERSITY <span>청년의 가능성을 연결하는 배움</span></div></div></section><div class="quick"><div class="wrap">${[['apply','01','교육신청'],['notices','02','공지사항'],['organization','03','AI융합원 소개'],['faq','04','자주 묻는 질문']].map(([id,no,name])=>`<a href="#/${id}"><span>${no}</span>${name}<b aria-hidden="true">↗</b></a>`).join('')}</div></div><section class="section wrap">${title('LEARN. BUILD. LEAP.','나의 다음을 만드는 교육',link('courses','전체 과정 ↗','text-link'))}${cards()}</section><section class="section pale"><div class="wrap split"><div>${title('NOTICE','부트캠프 소식',link('notices','전체보기 ↗','text-link'))}${C.notices.length?rows(C.notices.slice(0,3),'notices'):empty('새로운 소식을 준비하고 있습니다.','모집과 교육에 관한 안내를 이곳에 전해드립니다.')}</div><div>${title('BEYOND THE CLASSROOM','배움, 그다음의 경험')}<div class="programs" style="grid-template-columns:1fr"><a class="program" href="#/programs"><h3>함께 만들고, 더 넓게 경험하다 ↗</h3><p>해커톤 · 현장실습 · 글로벌 프로그램<br>강의실에서 시작한 배움을 다양한 현장으로 연결합니다.</p></a></div></div></div></section><section class="section wrap">${title('HOW TO JOIN','도약을 시작하는 방법')}<div class="steps">${[['과정 탐색','나의 관심 분야와 수준에 맞는 과정을 살펴보세요.'],['모집공고 확인','지원 자격과 교육 일정, 제출 서류를 확인하세요.'],['신청서 제출','모집공고에 안내된 신청 경로로 지원하세요.'],['선발 및 참여','선발 결과와 교육 안내에 따라 참여하세요.']].map(([a,b],i)=>`<div class="step"><b>STEP 0${i+1}</b><h3>${a}</h3><p>${b}</p></div>`).join('')}</div><div class="wide-cta"><div><h3>당신의 새로운 시작을 함께합니다.</h3><p>교육과정과 참여 방법이 궁금하다면 확인해 보세요.</p></div>${link('faq','자주 묻는 질문 ↗')}</div></section>`}
function shell(id,body,description=''){const group=groups.find(g=>g.items.some(x=>x[0]===id));const name=group?.items.find(x=>x[0]===id)?.[1]||'페이지를 찾을 수 없습니다';return `<div class="page-head"><div class="wrap"><div class="breadcrumb"><a href="#/">홈</a> / ${group?.name||'안내'} / ${name}</div><h1>${name}</h1>${description?`<p>${esc(description)}</p>`:''}</div></div>${group?`<nav class="subnav" aria-label="하위 메뉴"><div class="wrap">${group.items.map(([key,text])=>`<a href="#/${key}" ${key===id?'aria-current="page"':''}>${text}</a>`).join('')}</div></nav>`:''}<div class="wrap page-content">${body}</div>`}
function board(id,detail){const data=C[id]||[];if(detail){const n=data.find(x=>x.id===detail);return shell(id,n?`<article class="article"><span class="eyebrow">${esc(n.category)} · ${esc(n.date)}</span><h2>${esc(n.title)}</h2>${(n.body||[]).map(p=>`<p>${esc(p)}</p>`).join('')}${external(n.url,'관련 링크 확인')}<div>${link(id,'목록으로 돌아가기','button back')}</div></article>`:empty('게시물을 찾을 수 없습니다.')+link(id,'목록으로 돌아가기'))}return shell(id,`<form class="search" id="search-form" role="search"><input type="search" id="search-input" aria-label="게시물 검색" placeholder="제목 또는 내용 검색"><button class="button primary" type="submit">검색</button></form><div id="board-results" aria-live="polite">${data.length?rows(data,id):empty('등록된 게시물이 없습니다.')}</div>`)}
function contact(){return `<div class="contact-links">${C.contact.email?`<a class="button" href="mailto:${esc(C.contact.email)}">${esc(C.contact.email)}</a>`:''}${C.contact.phone?`<a class="button" href="tel:${esc(C.contact.phone)}">${esc(C.contact.phone)}</a>`:''}${external(C.inquiryUrl,'문의 접수')}</div>`}
function page(id,detail){
 if(['notices','jobs','activities','news','magazine'].includes(id))return board(id,detail);

 switch(id){
 case 'about':return shell(id,`<span class="eyebrow">LEARNING INTO OPPORTUNITY</span><h2>배운 것을 만들고,<br>만든 것으로 도약합니다.</h2><p class="lead">제주대학교 청년도약 부트캠프는 AI 교육과 실무 경험을 연결합니다. 기초 학습부터 기업 연계 프로젝트, 더 넓은 현장에서의 경험까지 청년의 성장을 지원합니다.</p><div class="info-grid">${[['01','단계별 역량 성장','초급부터 중급·고급까지, AI를 이해하고 활용하는 역량을 쌓습니다.'],['02','실무 중심 경험','프로젝트와 멘토링을 통해 실제 문제를 해결하는 방법을 배웁니다.'],['03','더 넓은 기회 연결','해커톤, 현장실습, 글로벌 프로그램으로 배움의 폭을 넓힙니다.']].map(([a,b,c])=>`<div class="info-box"><b>${a}</b><h3>${b}</h3><p>${c}</p></div>`).join('')}</div>`);
 case 'organization':return shell(id,`<div class="org-scroll" tabindex="0" aria-label="AI융합원 조직도, 좁은 화면에서는 좌우로 이동"><img class="org" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMjAwIiBoZWlnaHQ9IjkwMCIgdmlld0JveD0iMCAwIDEyMDAgOTAwIiByb2xlPSJpbWciIGFyaWEtbGFiZWxsZWRieT0idGl0bGUgZGVzYyI+CiAgPHRpdGxlIGlkPSJ0aXRsZSI+7KCc7KO864yA7ZWZ6rWQIEFJ7Jy17ZWp7JuQIOyhsOyngeuPhDwvdGl0bGU+CiAgPGRlc2MgaWQ9ImRlc2MiPkFJ7Jy17ZWp7JuQ7J6l7J2EIOykkeyLrOycvOuhnCDsmrTsmIHsnITsm5DtmowsIOyCsO2Vme2YkeugpSDsnpDrrLjri6gsIOq1kOycoeyatOyYge2MgCwg6riw7JeF7ZiR66Cl7YyALCDshLHqs7zqtIDrpqztjIAsIO2WieygleyngOybkO2MgOydhCDsl7DqsrDtlZwg7KGw7KeB64+EPC9kZXNjPgogIDxkZWZzPgogICAgPGZpbHRlciBpZD0ic2hhZG93IiB4PSItMTUlIiB5PSItMjAlIiB3aWR0aD0iMTMwJSIgaGVpZ2h0PSIxNTAlIj4KICAgICAgPGZlRHJvcFNoYWRvdyBkeD0iMCIgZHk9IjgiIHN0ZERldmlhdGlvbj0iMTIiIGZsb29kLWNvbG9yPSIjMDY0QjNCIiBmbG9vZC1vcGFjaXR5PSIwLjEwIi8+CiAgICA8L2ZpbHRlcj4KICAgIDxsaW5lYXJHcmFkaWVudCBpZD0iaGVhZGVyR3JhZGllbnQiIHgxPSIwIiB5MT0iMCIgeDI9IjEiIHkyPSIxIj4KICAgICAgPHN0b3Agb2Zmc2V0PSIwIiBzdG9wLWNvbG9yPSIjMDY0QjNCIi8+CiAgICAgIDxzdG9wIG9mZnNldD0iMSIgc3RvcC1jb2xvcj0iIzA4N0E1QiIvPgogICAgPC9saW5lYXJHcmFkaWVudD4KICAgIDxzdHlsZT4KICAgICAgdGV4dCB7IGZvbnQtZmFtaWx5OiAiUHJldGVuZGFyZCBWYXJpYWJsZSIsIFByZXRlbmRhcmQsICJOb3RvIFNhbnMgS1IiLCAiQXBwbGUgU0QgR290aGljIE5lbyIsIEFyaWFsLCBzYW5zLXNlcmlmOyB9CiAgICAgIC5leWVicm93IHsgZm9udC1zaXplOiAxNXB4OyBmb250LXdlaWdodDogNzAwOyBsZXR0ZXItc3BhY2luZzogMi40cHg7IGZpbGw6ICMwQThGNjg7IH0KICAgICAgLnBhZ2UtdGl0bGUgeyBmb250LXNpemU6IDQycHg7IGZvbnQtd2VpZ2h0OiA4MDA7IGZpbGw6ICMxNzIxMUU7IH0KICAgICAgLnBhZ2Utc3VidGl0bGUgeyBmb250LXNpemU6IDE3cHg7IGZvbnQtd2VpZ2h0OiA0MDA7IGZpbGw6ICM2Qjc3NzM7IH0KICAgICAgLmxlYWRlci10aXRsZSB7IGZvbnQtc2l6ZTogMjVweDsgZm9udC13ZWlnaHQ6IDgwMDsgZmlsbDogI0ZGRkZGRjsgfQogICAgICAubGVhZGVyLXN1YnRpdGxlIHsgZm9udC1zaXplOiAxNHB4OyBmb250LXdlaWdodDogNTAwOyBmaWxsOiAjRDlFRUU3OyBsZXR0ZXItc3BhY2luZzogLjVweDsgfQogICAgICAuc2lkZS10aXRsZSB7IGZvbnQtc2l6ZTogMThweDsgZm9udC13ZWlnaHQ6IDc1MDsgZmlsbDogIzA2NEIzQjsgfQogICAgI  case 'environment':return shell(id,empty('교육 공간을 준비하고 있습니다.','과정별 강의실과 실습 환경은 교육 안내를 통해 확인해 주세요.'));
 case 'location':return shell(id,C.contact.address?`<h2>제주대학교 AI융합원</h2><p class="lead">${esc(C.contact.address)}</p>${external(C.contact.mapUrl,'지도에서 보기')}${contact()}`:empty('방문 안내를 준비하고 있습니다.','방문 장소와 담당자 연락처가 확정되면 안내드립니다.'));
 case 'courses':return shell(id,cards()+`<div class="wide-cta"><div><h3>교육을 넘어, 현장으로</h3><p>해커톤·현장실습·글로벌 프로그램을 살펴보세요.</p></div>${link('programs','연계 프로그램 ↗')}</div>`,'기초부터 실무, 심화까지 나에게 맞는 과정을 찾아보세요.');
 case 'programs':return shell(id,`<div class="info-grid">${[['HACKATHON','해커톤','팀의 아이디어를 발전시키고, 결과물을 발표하며 문제 해결 경험을 쌓습니다.'],['INTERNSHIP','현장실습','기업 현장에서 협업과 실무를 경험하며 교육에서 익힌 역량을 활용합니다.'],['GLOBAL','글로벌 프로그램','해외 교육과 교류를 통해 AI 기술과 산업을 바라보는 시야를 넓힙니다.']].map(([a,b,c])=>`<div class="info-box"><b>${a}</b><h3>${b}</h3><p>${c}</p></div>`).join('')}</div><p class="note">프로그램별 참여 대상, 선발 기준과 운영 일정은 별도 모집공고에서 안내합니다.</p>${link('notices','모집공고 확인','button primary')}`);
 case 'benefits':return shell(id,`<p class="lead">교육 이후에도 배움을 이어갈 수 있도록 과정별 후속 프로그램을 안내합니다.</p>${empty('지원혜택은 과정별로 안내합니다.','취업·현장실습 연계, 인증 및 후속 프로그램의 제공 여부와 조건은 각 모집공고를 확인해 주세요.')}${link('notices','공지사항 확인','button back')}`);
 case 'apply':return shell(id,`<h2>나에게 맞는 과정을 확인하고 지원하세요.</h2><ol class="curriculum"><li>교육과정과 지원 자격 확인</li><li>모집기간 및 제출 서류 확인</li><li>신청 링크에서 접수 진행</li></ol>${safeUrl(C.applicationUrl)?external(C.applicationUrl,'교육 신청하기'):empty('현재 게시된 신청 링크가 없습니다.','모집이 시작되면 신청 기간과 접수 링크를 안내합니다.')}<div class="actions">${link('notices','모집공고 확인','button primary')}${link('courses','교육과정 보기')}</div>`);
 case 'partners':return shell(id,C.partners.length?`<div class="info-grid">${C.partners.map(p=>`<div class="info-box"><h3>${esc(p.name)}</h3><p>${esc(p.role)}</p>${external(p.url,'기관 홈페이지')}</div>`).join('')}</div>`:empty('협력기관을 소개할 예정입니다.','참여가 확인된 기업·기관의 정보와 협력 분야를 안내합니다.'));
 case 'partner-apply':return shell(id,`<h2>청년의 성장에 함께할 파트너를 기다립니다.</h2><p class="lead">교육, 프로젝트, 멘토링과 현장실습을 통해 청년과 산업 현장을 연결합니다.</p>${safeUrl(C.partnerApplicationUrl)?external(C.partnerApplicationUrl,'참여기관 신청하기'):empty('참여기관 모집 안내를 준비하고 있습니다.','협력 분야와 신청 절차가 확정되면 이곳에서 안내합니다.')}${contact()}`);
 case 'faq':return shell(id,C.faq.map(([q,a])=>`<details><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join(''));
 case 'inquiry':return shell(id,`${link('faq','자주 묻는 질문 확인','button primary')}<div style="margin-top:32px">${C.inquiryUrl||C.contact.email||C.contact.phone?'<h2>문의 안내</h2><p>아래 문의 경로로 연락해 주세요.</p>'+contact():empty('문의 접수 안내를 준비하고 있습니다.','문의 연락처와 접수 경로가 등록되면 안내합니다.')}</div>`);
 default:return shell(id,empty('요청하신 페이지가 없습니다.')+link('','홈으로 돌아가기','button back'));
 }}
function render(focus=false){let parts;try{parts=decodeURIComponent(location.hash.replace(/^#\/?/,'' )).split('/')}catch{parts=['missing']}const [id,detail]=parts;main.innerHTML=id?page(id,detail):home();const active=groups.find(g=>g.items.some(x=>x[0]===id));document.querySelector('#navigation').innerHTML=groups.map(g=>`<a href="#/${g.items[0][0]}" aria-current="${g===active}">${g.name}</a>`).join('');document.querySelector('#navigation').classList.remove('open');document.querySelector('.menu-toggle').setAttribute('aria-expanded','false');document.title=(id?(active?.items.find(x=>x[0]===id)?.[1]||'안내')+' | ':'')+'제주대학교 청년도약 부트캠프';const form=document.querySelector('#search-form');if(form)form.addEventListener('submit',e=>{e.preventDefault();const q=document.querySelector('#search-input').value.trim().toLowerCase();const items=C[id].filter(n=>[n.title,...(n.body||[])].join(' ').toLowerCase().includes(q));document.querySelector('#board-results').innerHTML=items.length?rows(items,id):empty(q?'검색 결과가 없습니다.':'등록된 게시물이 없습니다.',q?'다른 검색어로 다시 검색해 주세요.':'새로운 소식이 등록되면 이곳에서 확인하실 수 있습니다.')});if(focus){window.scrollTo(0,0);main.focus({preventScroll:true})}}
document.querySelector('.menu-toggle').addEventListener('click',e=>{const open=document.querySelector('#navigation').classList.toggle('open');e.currentTarget.setAttribute('aria-expanded',String(open))});document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelector('#navigation').classList.remove('open');document.querySelector('.menu-toggle').setAttribute('aria-expanded','false')}});if(C.brandLogo&&/^\.\/assets\/[\w./-]+$/.test(C.brandLogo)){const img=document.createElement('img');img.src=C.brandLogo;img.alt='제주대학교';document.querySelector('.university').replaceWith(img)}document.querySelector('#year').textContent=new Date().getFullYear();window.addEventListener('hashchange',()=>render(true));render();
</script></body></html>
